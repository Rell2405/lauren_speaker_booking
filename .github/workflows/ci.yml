name: Verify

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and Astro configuration
        run: npm run check

      - name: Build GitHub Pages site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: npm run build

      - name: Verify production artifact
        run: |
          test -f dist/index.html
          test -f dist/.nojekyll
          test -f dist/images/lauren-hero.png
          grep -q "Lauren Green equips leaders" dist/index.html
          grep -q "/${{ github.event.repository.name }}/images/lauren-hero.png" dist/index.html
